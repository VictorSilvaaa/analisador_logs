version: "3.8"

services:
  # Backend Laravel
  analisadorlogs_backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: analisadorlogs_backend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www
    networks:
      - app-network
    depends_on:
      - analisadorlogs_db

  # Banco MySQL
  analisadorlogs_db:
    image: mysql:8.0
    container_name: analisadorlogs_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  # Emails
  analisadorlogs_mailhog:
    image: mailhog/mailhog
    container_name: analisadorlogs_mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"   # Interface web
      - "1025:1025"   # Porta SMTP
    networks:
      - app-network
      
networks:
  app-network:

volumes:
  db_data:
